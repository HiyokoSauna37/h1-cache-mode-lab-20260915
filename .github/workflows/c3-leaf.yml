name: c3-nested-leaf

on:
  workflow_call:

permissions:
  contents: read

jobs:
  save-cache:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Record effective cache mode
        run: printf 'effective=%s\n' "$ACTIONS_CACHE_MODE"
      - name: Create leaf canary
        run: |
          mkdir -p .cache-c3
          printf 'leaf-%s\n' "$GITHUB_RUN_ID" > .cache-c3/canary.txt
      - name: Save leaf cache
        uses: actions/cache@v4
        with:
          path: .cache-c3
          key: c3-leaf-${{ github.run_id }}
