name: c10-later-secret-artifact

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create baseline artifact
        run: |
          mkdir -p .artifact-c10-baseline
          printf 'baseline-owned-c10-%s\n' "$GITHUB_RUN_ID" > .artifact-c10-baseline/canary.txt
      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: c10-baseline-${{ github.run_id }}
          path: .artifact-c10-baseline/
          if-no-files-found: error
          retention-days: 1

  issuer:
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: B1 download baseline with current issuer tuple
        uses: actions/download-artifact@v4
        with:
          name: c10-baseline-${{ github.run_id }}
          path: .artifact-c10-baseline
      - name: B1 prove exact baseline and secret absence
        run: |
          test "$(cat .artifact-c10-baseline/canary.txt)" = "baseline-owned-c10-$GITHUB_RUN_ID"
          test -z "$C10_WRITER_SECRET"
          printf 'b1=exact-baseline; issuer-secret=absent\n'
      - name: Seal issuer tuple and official artifact client
        uses: actions/github-script@v8
        env:
          C10_RECIPIENT_CERT_B64: 
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const childProcess = require("child_process");
            for (const field of ["ACTIONS_RUNTIME_TOKEN", "ACTIONS_RESULTS_URL"]) {
              if (!process.env[field]) throw new Error("missing " + field);
            }
            const bundle = path.join(process.env.GITHUB_WORKSPACE, "c10-replay");
            const plaintext = path.join(process.env.RUNNER_TEMP, "c10-payload.json");
            const cert = path.join(process.env.RUNNER_TEMP, "c10-recipient-cert.pem");
            fs.mkdirSync(bundle, {recursive: true});
            const fields = [
              "ACTIONS_RUNTIME_TOKEN",
              "ACTIONS_RESULTS_URL",
              "GITHUB_RUN_ID",
              "GITHUB_REPOSITORY",
              "GITHUB_REF",
              "GITHUB_SHA",
              "RUNNER_OS",
              "RUNNER_ARCH",
            ];
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            let tokenFormat = "opaque";
            let tokenClaims = {};
            const parts = token.split(".");
            if (parts.length === 3) {
              try {
                const padded = parts[1].replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(parts[1].length / 4) * 4, "=");
                const decoded = JSON.parse(Buffer.from(padded, "base64").toString("utf8"));
                tokenFormat = "jwt";
                for (const name of ["iat", "nbf", "exp", "iss", "aud", "ac"]) {
                  if (Object.prototype.hasOwnProperty.call(decoded, name)) tokenClaims[name] = decoded[name];
                }
              } catch (_) {
                tokenFormat = "three-segment-unparsed";
              }
            }
            fs.writeFileSync(
              plaintext,
              JSON.stringify(Object.fromEntries(fields.map(field => [field, process.env[field] || ""]))),
              {mode: 0o600},
            );
            fs.writeFileSync(cert, Buffer.from(process.env.C10_RECIPIENT_CERT_B64, "base64"), {mode: 0o600});
            childProcess.execFileSync("openssl", [
              "cms", "-encrypt", "-binary", "-aes-256-cbc",
              "-in", plaintext,
              "-out", path.join(bundle, "c10-payload.p7m"),
              "-outform", "DER",
              "-recip", cert,
            ]);
            fs.rmSync(plaintext);
            fs.rmSync(cert);
            const actionRoot = path.resolve(
              process.env.GITHUB_WORKSPACE,
              "..", "..", "_actions", "actions", "download-artifact", "v4",
            );
            const actionBundle = path.join(actionRoot, "dist", "index.js");
            if (!fs.existsSync(actionBundle)) throw new Error("download-artifact bundle missing");
            childProcess.execFileSync("tar", [
              "-C", actionRoot,
              "-czf", path.join(bundle, "actions-download-artifact-v4.tgz"),
              "action.yml", "dist/index.js",
            ]);
            fs.writeFileSync(path.join(bundle, "metadata.json"), JSON.stringify({
              issuerRunId: process.env.GITHUB_RUN_ID,
              issuerCaptureUtc: new Date().toISOString(),
              baselineArtifactName: "c10-baseline-" + process.env.GITHUB_RUN_ID,
              futureArtifactName: "c10-future-" + process.env.GITHUB_RUN_ID,
              repository: process.env.GITHUB_REPOSITORY,
              tokenFormat,
              tokenClaims,
            }));
      - name: Upload encrypted issuer carrier
        uses: actions/upload-artifact@v4
        with:
          name: c10-replay-${{ github.run_id }}
          path: c10-replay/
          if-no-files-found: error
          retention-days: 1

  future-writer:
    needs: issuer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      C10_WRITER_SECRET: ${{ secrets.C10_WRITER_SECRET }}
    steps:
      - name: Create later job-only secret artifact
        run: |
          test -n "$C10_WRITER_SECRET"
          test "${#C10_WRITER_SECRET}" -eq 64
          mkdir -p .artifact-c10-future
          printf '%s' "$C10_WRITER_SECRET" > .artifact-c10-future/writer-secret.txt
      - name: Upload later secret artifact
        uses: actions/upload-artifact@v4
        with:
          name: c10-future-${{ github.run_id }}
          path: .artifact-c10-future/
          if-no-files-found: error
          retention-days: 1

  future-control:
    needs: future-writer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      C10_WRITER_SECRET: ${{ secrets.C10_WRITER_SECRET }}
    steps:
      - name: B1 download future artifact with fresh tuple
        uses: actions/download-artifact@v4
        with:
          name: c10-future-${{ github.run_id }}
          path: .artifact-c10-future
      - name: B1 prove exact later job-only secret bytes
        run: |
          test -n "$C10_WRITER_SECRET"
          test "$(wc -c < .artifact-c10-future/writer-secret.txt)" -eq 64
          printf '%s' "$C10_WRITER_SECRET" | cmp -s - .artifact-c10-future/writer-secret.txt
          printf 'b1=future-artifact-exact-secret\n'

